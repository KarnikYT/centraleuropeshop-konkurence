name: Roblox Competitor Tracker

on:
  schedule:
    - cron: '0 8 * * *' # Spustí se každý den v 8:00 UTC
  workflow_dispatch: # Umožňuje ruční spuštění z GitHub rozhraní

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Tracker Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tracker.py

      - name: Commit and push updated state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "chore: update competitor state [skip ci]" && git push)
